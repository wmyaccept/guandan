<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c4a34" />
  <link rel="preload" as="image" href="/lobby-hero.jpg?v=7" />
  <title>掼蛋桌</title>
  <link rel="stylesheet" href="/styles.css?v=9" />
</head>
<body>
  <div id="lobby" class="lobby">
    <section class="lobby-scene">
      <img class="lobby-hero" src="/lobby-hero.jpg?v=7" alt="" draggable="false" />
      <div class="lobby-veil"></div>
      <div class="lobby-copy">
        <p class="kicker">四人两副牌</p>
        <h1>掼蛋</h1>
        <p class="sub">对家一队。从 2 打到 A。</p>
      </div>
    </section>
    <form id="entry" class="entry">
      <label>
        昵称
        <input id="name" maxlength="12" autocomplete="nickname" />
      </label>
      <label>
        房间号
        <input id="code" maxlength="6" placeholder="加入时填写" autocomplete="off" />
      </label>
      <div class="entry-actions">
        <button type="button" id="createBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          开新桌
        </button>
        <button type="button" id="joinBtn" class="ghost">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
          加入
        </button>
      </div>
      <p id="lobbyError" class="error"></p>
    </form>
  </div>

  <div id="table" class="table hidden">
    <header class="topbar">
      <div class="top-info">
        <span class="room" id="roomCode"></span>
        <span id="levelLine"></span>
        <span id="clock" class="clock hidden"></span>
      </div>
      <div class="top-actions">
        <div class="tool-group">
          <button type="button" id="zoomOutBtn" class="icon" title="缩小" aria-label="缩小">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button type="button" id="zoomInBtn" class="icon" title="放大" aria-label="放大">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          </button>
          <button type="button" id="soundBtn" class="icon" title="提示音开关" aria-label="提示音开关">
            <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
          </button>
        </div>
        <button type="button" id="botBtn">补机器人</button>
        <button type="button" id="startBtn">开局</button>
        <button type="button" id="leaveBtn" class="ghost quit" title="回到主页">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          退出
        </button>
        <button type="button" id="nextBtn" class="hidden">下一局</button>
      </div>
    </header>

    <section class="felt">
      <div class="board">
        <article class="seat seat-top" data-view="2"></article>
        <article class="seat seat-left" data-view="3"></article>
        <article class="seat seat-right" data-view="1"></article>
        <article class="seat seat-bottom" data-view="0"></article>
        <div class="center">
          <div id="trick" class="trick"></div>
          <p id="banner" class="banner"></p>
          <div id="notice" class="notice hidden"></div>
        </div>
      </div>
        <footer class="dock">
          <div class="hand-wrap">
            <div id="selfStatus" class="self-status"></div>
            <div id="hand" class="hand"></div>
          </div>
          <div class="play-actions">
            <button type="button" id="groupBtn" class="ghost">组牌</button>
            <button type="button" id="hintBtn" class="ghost">提示</button>
            <button type="button" id="passBtn">不要</button>
            <button type="button" id="playBtn">出牌</button>
          </div>
        </footer>
    </section>

    <div id="fx" class="fx"></div>
    <p id="toast" class="toast hidden"></p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js?v=9"></script>
</body>
</html>
