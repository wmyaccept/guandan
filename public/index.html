<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c4a34" />
  <link rel="preload" as="image" href="/lobby-hero.jpg?v=7" />
  <title>掼蛋桌</title>
  <link rel="stylesheet" href="/styles.css?v=15" />
</head>
<body>
  <div id="lobby" class="lobby">
    <button type="button" id="lobbySettingsBtn" class="icon lobby-gear" title="外观设置" aria-label="外观设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <section class="lobby-scene">
      <img class="lobby-hero" src="/lobby-hero.jpg?v=7" alt="" draggable="false" />
      <div class="lobby-veil"></div>
      <div class="lobby-copy">
        <p class="kicker">四人两副牌</p>
        <h1>掼蛋</h1>
        <p class="sub">对家一队。从 2 打到 A。</p>
      </div>
    </section>
    <form id="entry" class="entry">
      <label>
        昵称
        <input id="name" maxlength="12" autocomplete="nickname" />
      </label>
      <label>
        房间号
        <input id="code" maxlength="6" placeholder="加入时填写" autocomplete="off" />
      </label>
      <div class="entry-actions">
        <button type="button" id="createBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          开新桌
        </button>
        <button type="button" id="joinBtn" class="ghost">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
          加入
        </button>
      </div>
      <p id="lobbyError" class="error"></p>
    </form>
  </div>

  <div id="table" class="table hidden">
    <header class="topbar">
      <div class="top-info">
        <span class="room" id="roomCode"></span>
        <span id="levelLine"></span>
        <span id="clock" class="clock hidden"></span>
      </div>
      <div class="top-actions">
        <div class="tool-group">
          <button type="button" id="zoomOutBtn" class="icon" title="缩小" aria-label="缩小">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button type="button" id="zoomInBtn" class="icon" title="放大" aria-label="放大">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          </button>
          <button type="button" id="counterBtn" class="icon hidden" title="记牌器" aria-label="记牌器" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3.5" y1="6" x2="3.51" y2="6"/><line x1="3.5" y1="12" x2="3.51" y2="12"/><line x1="3.5" y1="18" x2="3.51" y2="18"/></svg>
          </button>
          <button type="button" id="spectateBtn" class="icon hidden" title="队友视角" aria-label="队友视角" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button type="button" id="soundBtn" class="icon" title="提示音开关" aria-label="提示音开关">
            <svg class="ic-on" viewBox="0 0 24 24" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            <svg class="ic-off" viewBox="0 0 24 24" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
          </button>
        </div>
        <button type="button" id="settingsBtn" class="icon" title="外观设置" aria-label="外观设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <div id="diffGroup" class="seg-group" role="group" aria-label="机器人强度">
          <span class="seg-cap">人机</span>
          <button type="button" class="seg" data-diff="easy" title="不看队友，乱用炸弹">简单</button>
          <button type="button" class="seg" data-diff="medium" title="会算牌，但不顾队友">中等</button>
          <button type="button" class="seg" data-diff="hard" title="配合队友，会拦牌">强力</button>
        </div>
        <button type="button" id="botBtn">补机器人</button>
        <button type="button" id="startBtn">开局</button>
        <button type="button" id="leaveBtn" class="ghost quit" title="回到主页">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          退出
        </button>
        <button type="button" id="nextBtn" class="hidden">下一局</button>
      </div>
    </header>

    <section class="felt">
      <div class="board">
        <div id="counter" class="counter hidden">
          <div class="counter-head"><span>记牌器</span><span id="counterNote">未见 0 张</span></div>
          <div id="counterGrid" class="counter-grid"></div>
        </div>
        <div class="board-decor" aria-hidden="true">
          <span class="decor-ring"></span>
          <span class="decor-mark">掼蛋</span>
        </div>
        <article class="seat seat-top" data-view="2"></article>
        <article class="seat seat-left" data-view="3"></article>
        <article class="seat seat-right" data-view="1"></article>
        <article class="seat seat-bottom" data-view="0"></article>
        <div class="center">
          <div id="trick" class="trick"></div>
          <p id="banner" class="banner"></p>
          <div id="notice" class="notice hidden"></div>
        </div>
      </div>
        <footer class="dock">
          <div class="hand-wrap">
            <div id="selfStatus" class="self-status"></div>
            <div id="hand" class="hand"></div>
          </div>
          <div class="play-actions">
            <button type="button" id="groupBtn" class="ghost">组牌</button>
            <button type="button" id="hintBtn" class="ghost">提示</button>
            <button type="button" id="passBtn">不要</button>
            <button type="button" id="playBtn">出牌</button>
          </div>
        </footer>
    </section>

    <div id="fx" class="fx"></div>
    <div id="gestureLayer" class="gesture-layer" aria-hidden="true"></div>
    <div id="gesturePop" class="gesture-pop hidden" role="menu"></div>
    <p id="toast" class="toast hidden"></p>
  </div>

  <div id="comboChoice" class="combo-choice hidden" role="dialog" aria-modal="true" aria-label="选择牌型">
    <div class="combo-choice-card">
      <button type="button" id="comboChoiceClose" class="icon combo-choice-close" title="取消" aria-label="取消">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <p class="combo-choice-title">这手牌有逢人配，选一个打法</p>
      <div id="comboOptions" class="combo-options"></div>
    </div>
  </div>
  <div id="settingsPanel" class="settings hidden" role="dialog" aria-label="外观设置">
    <div class="settings-head">
      <span>外观设置</span>
      <button type="button" id="settingsClose" class="icon" title="关闭" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="settings-body">
      <p class="settings-label">牌面</p>
      <div id="cardSkins" class="opt-row"></div>
      <p class="settings-label">桌布</p>
      <div id="feltColors" class="opt-row"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js?v=15"></script>
</body>
</html>
